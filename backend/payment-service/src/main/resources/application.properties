spring.application.name=payment-service

# Secret provided at runtime via STRIPE_SECRET_KEY env var (do not commit keys)
stripe.secretKey=${STRIPE_SECRET_KEY:}

# Base URL of the order service, used to fetch the persisted order and recompute
# the payable amount server-side (never trust a client-supplied amount).
order.service.url=${ORDER_SERVICE_URL:http://localhost:3008}

server.port=8081
