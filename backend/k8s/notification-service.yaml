---
# SECURITY (NOTIF-07, CWE-798): real MongoDB URI + Gmail app password were
# committed here in plaintext base64. Never commit secrets. Populate this
# Secret out-of-band (kubectl create secret / Helm / a secret manager) and
# reference only names; rotate any credential that was ever committed.
apiVersion: v1
kind: Secret
metadata:
  name: notification-service-secrets
type: Opaque
stringData:
  mongo-uri: '<replace-with-rotated-mongo-uri>'
  email-user: '<replace-with-mailbox-user>'
  email-pass: '<replace-with-app-password>'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: kaweesha/notification-service:latest  # Replace with your image name
          ports:
            - containerPort: 4006
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: notification-service-secrets
                  key: mongo-uri
            - name: EMAIL_USER
              valueFrom:
                secretKeyRef:
                  name: notification-service-secrets
                  key: email-user
            - name: EMAIL_PASS
              valueFrom:
                secretKeyRef:
                  name: notification-service-secrets
                  key: email-pass
            - name: PORT
              value: "4006"
      imagePullSecrets:
        - name: my-registry-key
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
spec:
  selector:
    app: notification-service
  ports:
    - protocol: TCP
      port: 80  # Expose this service on port 80
      targetPort: 4006  # Container port for your app
  type: LoadBalancer
